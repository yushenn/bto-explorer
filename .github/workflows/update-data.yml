name: Monthly data update

# Re-downloads every dataset from data.gov.sg, rebuilds the files the site reads,
# and commits them if anything changed. GitHub Pages then republishes the site.
on:
  schedule:
    - cron: "0 2 3 * *"   # 02:00 UTC on the 3rd of every month (10am Singapore time)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Download the latest data
        run: python analysis/download.py

      - name: Rebuild the site's data files
        run: python analysis/build.py

      - name: Commit if anything changed
        run: |
          git add data.json areas.geojson amenities.json blocks analysis/schools-geocoded.json
          if git diff --cached --quiet; then
            echo "No changes this month."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Monthly data update ($(date -u +%Y-%m))"
            git push
          fi
